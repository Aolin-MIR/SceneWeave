name: Update paper link after arXiv announcement

on:
  push:
    paths:
      - .github/workflows/update-arxiv-link.yml
      - tools/update_arxiv_link.py
  schedule:
    - cron: '23 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exact public arXiv record
        run: python tools/update_arxiv_link.py
      - name: Commit paper link and citation
        id: commit
        run: |
          if git diff --quiet -- README.md; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Link SceneWeave paper to public arXiv record"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"
      - name: Stop checks after update
        if: steps.commit.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-arxiv-link.yml/disable"
